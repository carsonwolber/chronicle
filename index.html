<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100e">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9038553980510906"
     crossorigin="anonymous"></script>
  <meta name="description" content="A little game of historical perspective. Put five events in order, or name one near a year.">
  <title>chroniclr — a game of historical perspective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="chroniclr home"><span class="wordmark-seal" aria-hidden="true">c</span><span>chroniclr</span></a>
    <div class="topbar-right">
      <div class="reset-clock"><span class="clock-mark" aria-hidden="true"></span><span>NEW ROUND IN</span><strong id="resetTimer">08:00:00</strong></div>
    </div>
  </header>

  <main class="page">
    <section class="game-shell" aria-label="chroniclr game">
      <div class="mode-bar" role="tablist" aria-label="Game mode">
        <button class="mode-tab is-active" id="orderMode" type="button" role="tab" aria-selected="true" aria-controls="gamePanel">RANDOM WINDOW</button>
        <button class="mode-tab" id="themeMode" type="button" role="tab" aria-selected="false" aria-controls="gamePanel">THEMED</button>
        <button class="mode-tab" id="nearMode" type="button" role="tab" aria-selected="false" aria-controls="gamePanel">NAME AN EVENT</button>
      </div>

      <section class="game-panel" id="gamePanel" aria-live="polite">
        <div class="challenge-heading" id="challengeHeading">
          <div>
            <div class="eyebrow" id="challengeEyebrow">FIVE MOMENTS · ONE WINDOW</div>
            <h1 id="challengeTitle"></h1>
          </div>
          <div class="year-window" id="yearWindow" aria-label="Year range"><span id="windowStart">1993</span><span class="window-dash">—</span><span id="windowEnd">2007</span></div>
        </div>

        <div class="prompt-line" id="promptLine"><span class="prompt-rule"></span><span>OLDEST TO NEWEST</span><span class="prompt-rule"></span></div>
        <ol class="event-list" id="eventList" aria-label="Events to order"></ol>
        <div class="event-entry" id="eventEntry" hidden>
          <div class="near-target"><span>YEAR</span><strong id="targetYear">2000</strong></div>
          <label for="eventSearch">Enter an event or historical person connected to this year</label>
          <div class="search-row"><textarea id="eventSearch" autocomplete="off" placeholder="Enter answer here" maxlength="100" rows="2"></textarea><button class="submit-search" id="searchEvent" type="button">CHECK ANSWER</button></div>
          <div class="search-results" id="searchResults" role="listbox" aria-label="Wikipedia results"></div>
          <div class="score-explainer">Closer dates score more. Less-viewed answers earn a rarity bonus.</div>
        </div>

        <div class="answer-panel" id="answerPanel" hidden></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="board-footer">
          <div class="board-actions"><button class="button button-secondary" id="shuffleRound" type="button">SHUFFLE</button><button class="button button-secondary" id="nextPlay" type="button" disabled>NEXT ROUND</button><button class="button button-primary" id="checkOrder" type="button">LOCK IN ORDER</button></div>
        </div>
      </section>

      <aside class="side-rail" aria-label="Your score">
        <section class="score-card">
          <div class="card-kicker">THIS ROUND <span id="roundIndex">01</span></div>
          <div class="score-number" id="scoreValue">—<span id="scoreUnit">/ 5</span></div>
          <div class="score-rule"><span id="progressFill"></span></div>
          <div class="score-caption" id="progressCopy">Correct positions</div>
        </section>
      </aside>
    </section>

    <footer class="page-footer"><span>chroniclr</span></footer>
  </main>

  <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="carsosaurus" data-description="Support me on Buy me a coffee!" data-message="" data-color="#C3A56C" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body>
</html>
